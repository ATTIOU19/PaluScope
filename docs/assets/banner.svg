<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">PaluScope</title>
  <desc id="d">Microscopie intelligente du paludisme : détection, localisation et quantification assistées</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f2d"/>
      <stop offset="0.6" stop-color="#3a1550"/>
      <stop offset="1" stop-color="#7a2a5c"/>
    </linearGradient>
    <radialGradient id="field" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#f2c1b8"/>
      <stop offset="1" stop-color="#d98a94"/>
    </radialGradient>
    <clipPath id="lens"><circle cx="985" cy="150" r="118"/></clipPath>
    <circle id="rbc" r="15" fill="#e57d86" fill-opacity="0.5" stroke="#c75a6a" stroke-opacity="0.45" stroke-width="2"/>
    <g id="par"><circle r="4.5" fill="#3b1456"/><circle cx="6" cy="3" r="2.5" fill="#5a2a7a"/></g>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- vue du microscope -->
  <circle cx="985" cy="150" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="985" cy="150" r="124" fill="#1a1230"/>
  <g clip-path="url(#lens)">
    <rect x="850" y="20" width="270" height="260" fill="url(#field)"/>
    <use href="#rbc" x="905" y="70"/><use href="#rbc" x="940" y="95"/><use href="#rbc" x="975" y="60"/>
    <use href="#rbc" x="1010" y="85"/><use href="#rbc" x="1050" y="65"/><use href="#rbc" x="1075" y="110"/>
    <use href="#rbc" x="890" y="125"/><use href="#rbc" x="925" y="150"/><use href="#rbc" x="965" y="130"/>
    <use href="#rbc" x="1030" y="130"/><use href="#rbc" x="1000" y="170"/><use href="#rbc" x="1070" y="165"/>
    <use href="#rbc" x="900" y="190"/><use href="#rbc" x="945" y="205"/><use href="#rbc" x="985" y="215"/>
    <use href="#rbc" x="1030" y="200"/><use href="#rbc" x="1065" y="225"/><use href="#rbc" x="915" y="240"/>
    <!-- globule blanc (non annoté) -->
    <circle cx="1045" cy="190" r="22" fill="#4a1d78"/>
    <circle cx="1038" cy="184" r="9" fill="#6b3a9a" fill-opacity="0.8"/>
    <!-- parasites candidats -->
    <use href="#par" x="948" y="108"/><use href="#par" x="1015" y="108"/><use href="#par" x="925" y="170"/>
    <use href="#par" x="1085" y="140"/><use href="#par" x="985" y="193"/>
  </g>
  <!-- boîtes de détection -->
  <g fill="none" stroke="#39ff88" stroke-width="2.5" stroke-linecap="round">
    <rect x="934" y="94" width="30" height="30" rx="2"/>
    <rect x="1001" y="94" width="30" height="30" rx="2"/>
    <rect x="911" y="156" width="30" height="30" rx="2"/>
    <rect x="1071" y="126" width="30" height="30" rx="2"/>
    <rect x="971" y="179" width="30" height="30" rx="2"/>
  </g>
  <circle cx="985" cy="150" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>

  <!-- texte -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="60" y="108" font-size="68" font-weight="700" letter-spacing="1">PaluScope</text>
    <rect x="62" y="124" width="84" height="5" rx="2.5" fill="#39ff88"/>
    <text x="60" y="166" font-size="26" fill="#f6dcec">Microscopie intelligente du paludisme</text>
    <text x="60" y="198" font-size="17" fill="#d6bfe0">Détection · Localisation · Comptage assistés par vision par ordinateur</text>
  </g>

  <!-- pastilles -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">
    <rect x="60" y="226" width="190" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="155" y="248">AMA · PIIA Cohorte 2</text>
    <rect x="262" y="226" width="224" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="374" y="248">Spécial Machine Learning</text>
    <rect x="498" y="226" width="238" height="34" rx="17" fill="#39ff88" fill-opacity="0.18" stroke="#39ff88" stroke-opacity="0.7"/>
    <text x="617" y="248">Phase 0 · Quality Analyzer</text>
  </g>
</svg>